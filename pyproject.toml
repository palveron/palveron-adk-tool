[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palveron-adk-tool"
version = "1.1.0"
description = "AI Governance tool for Flare AI agents — policy enforcement, PII detection, blockchain attestation via Google ADK"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Palveron", email = "hello@palveron.com" }]
keywords = [
    "palveron",
    "flare",
    "flare-ai-kit",
    "google-adk",
    "ai-governance",
    "agent-tools",
    "guardrails",
    "eu-ai-act",
    "dora",
    "compliance",
    "pii-detection",
    "blockchain-attestation",
    "audit-trail",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "palveron-sdk>=1.1.0",
    "google-adk>=0.1.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.5",
    "build",
]

[project.urls]
Homepage = "https://palveron.com"
Documentation = "https://docs.palveron.com/integrations/flare-ai-kit"
Repository = "https://github.com/palveron/palveron-adk-tool"
Issues = "https://github.com/palveron/palveron-adk-tool/issues"
Changelog = "https://github.com/palveron/palveron-adk-tool/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["palveron_adk_tool"]

[tool.hatch.build.targets.sdist]
include = [
    "palveron_adk_tool",
    "examples",
    "tests",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["palveron_adk_tool"]

# External dependencies — typed at the boundary, `Any` inside.
# google-adk and palveron-sdk are runtime dependencies but ship without
# inline type stubs (or with stubs that change between minor versions).
# Treating them as `Any` keeps the public surface of palveron-adk-tool
# strictly typed without coupling the type-check to their internals.
[[tool.mypy.overrides]]
module = ["google.adk.*", "palveron"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
