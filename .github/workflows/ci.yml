name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install build + test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check palveron_adk_tool tests examples

      - name: Type check (mypy)
        run: mypy palveron_adk_tool

      - name: Unit tests (pytest)
        run: pytest -q

      - name: Import smoke test
        run: |
          python -c "from palveron_adk_tool import PalveronGovernanceTool, GovernanceResult, GovernanceConfig; print('OK')"

      - name: Compile examples
        run: |
          python -m py_compile examples/governed_flare_agent.py
          python -m py_compile examples/defi_trading_agent.py
          python -m py_compile examples/social_agent.py

      - name: Legacy-reference guard
        shell: bash
        run: |
          # Fail the build if any legacy "vexis" reference slips back in.
          if grep -rni "vexis" palveron_adk_tool examples tests README.md CHANGELOG.md pyproject.toml; then
            echo "::error::Legacy 'vexis' reference detected"
            exit 1
          fi
          echo "No legacy references found."

  build:
    name: build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist + wheel
        run: python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
